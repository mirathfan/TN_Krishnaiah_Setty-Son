  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="70" y="70" width="760" height="1060" fill="none" stroke="#e6bf63" stroke-width="8"/>
  <rect x="105" y="105" width="690" height="990" fill="none" stroke="#f8e2a2" stroke-width="2" opacity="0.62"/>
