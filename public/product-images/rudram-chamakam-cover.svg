      <stop offset="1" stop-color="#2e0b10"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="44%">
      <stop offset="0" stop-color="#f7d77c" stop-opacity="0.95"/>
      <stop offset="0.46" stop-color="#f7d77c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f7d77c" stop-opacity="0"/>
